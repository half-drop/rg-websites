<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ravengard Wiki · 两个网站</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0d1413; color: #e7eee9; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { width: min(760px, calc(100% - 48px)); padding: 64px 0; }
    h1 { font-size: clamp(28px, 5vw, 44px); margin-bottom: 12px; }
    p { color: #a8b9b0; line-height: 1.7; }
    nav { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-top: 36px; }
    a { display: block; padding: 30px; color: inherit; text-decoration: none; border: 1px solid #34483d; border-radius: 14px; background: #16241d; }
    a:hover { border-color: #a6d5b1; background: #1b3024; }
    h2 { margin: 0 0 16px; font-size: 23px; }
    span { color: #b0dbc0; }
    footer { margin-top: 40px; color: #80978a; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Ravengard Wiki</h1>
    <p>选择一个版本，浏览资源目录与模型。</p>
    <nav aria-label="网站版本">
      <a href="./rg-wiki/"><h2>rg-wiki</h2><span>打开网站 →</span></a>
      <a href="./gpt5.6sol/"><h2>gpt5.6sol</h2><span>打开网站 →</span></a>
    </nav>
    <footer>两个网站保留各自的界面与功能。</footer>
  </main>
</body>
</html>
